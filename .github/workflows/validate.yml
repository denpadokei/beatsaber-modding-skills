name: Validate skills

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skill structure
        run: npm test
      - name: Verify skills.sh CLI discovery
        run: |
          set -euo pipefail
          output="$(npx --yes skills@latest add . --list)"
          echo "$output"
          grep -q 'beatsaber-pc-modding' <<< "$output"
          grep -q 'beatsaber-quest-modding' <<< "$output"
          grep -q 'chromapper-plugin-modding' <<< "$output"
        env:
          DISABLE_TELEMETRY: "1"
